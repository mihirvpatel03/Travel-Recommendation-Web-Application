<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Travel Recommendation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            Travel Recommendation
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact Us
            </a>

        </div>

    </nav>


    <!-- Contact Section -->
    <main>

        <section class="contact-section">

            <div class="contact-info">

                <h1>Contact Us</h1>

                <p>
                    Have a question or need help planning your next trip?
                    We'd love to hear from you.
                </p>

                <h2>Get In Touch</h2>

                <p>
                    📧 Email: travelrecommendation@example.com
                </p>

                <p>
                    📞 Phone: +91 98765 43210
                </p>

                <p>
                    📍 Location: Mumbai, India
                </p>

            </div>


            <!-- Contact Form -->
            <form
                class="contact-form"
                action="mailto:travelrecommendation@example.com"
                method="post"
                enctype="text/plain"
            >

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Enter your message"
                    required
                ></textarea>


                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

</body>

</html>
