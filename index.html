<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">Travel Recommendation</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search beaches, temples, countries..."
            >

            <button id="searchBtn">Search</button>
            <button id="clearBtn">Clear</button>
        </div>
    </nav>

    <main>

        <section class="hero">
            <div class="hero-content">
                <h1>Explore Your Next Destination</h1>

                <p>
                    Discover beautiful beaches, amazing temples,
                    and wonderful countries around the world.
                </p>

                <button>Explore Now</button>
            </div>
        </section>

        <section class="recommendations">
            <h2>Travel Recommendations</h2>

            <div id="recommendationContainer">
                <!-- Recommendations will appear here -->
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
